name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A superseded run on the same ref tells nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the APK with the commit it came from.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image ships the Android SDK, so no sdk.dir is needed: AGP reads ANDROID_HOME.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug

      # The app is sideloaded onto one phone, so the build is also the delivery.
      - uses: actions/upload-artifact@v4
        with:
          name: claude-twist-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
          if-no-files-found: ignore
